# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html
#
# El Book son los Capítulos; detrás van los anexos: 2) Extensiones (desarrollo
# matemático de los capítulos) y 3) Boletines. Se publican los capítulos revisados
# y sus extensiones, y los boletines revisados.
#
# Mientras no se publiquen, las referencias cruzadas desde los capítulos a
# ficheros fuera del TOC se renderizan como texto sin enlace (no son enlaces
# rotos, pero sí warnings).

format: jb-book
root: intro

parts:

  # ------------------------------------------------------------ 1. Capítulos
  - caption: Capítulos
    numbered: false      # la numeración de secciones va en los propios notebooks (1., 1.1.)
    chapters:
      - file: notebooks/introduccion.ipynb
      - file: notebooks/perspectivas.ipynb
      - file: notebooks/leptones.ipynb
      - file: notebooks/quarks_hadrons.ipynb
      - file: notebooks/sm.ipynb

  # ------------------------------------------------------------ 2. Anexos: extensiones
  - caption: "Anexos: extensiones"
    numbered: false
    chapters:
      - file: notebooks/intro_extension.ipynb
      - file: notebooks/ext-cinematica.ipynb
      - file: notebooks/ext-dirac.ipynb
      - file: notebooks/ext-quiral.ipynb
      - file: notebooks/ext-grupos.ipynb
      - file: notebooks/ext-feynman.ipynb
      - file: notebooks/ext-sm.ipynb
      # - file: notebooks/ext-dirac-old.ipynb   (versión anterior, sin publicar)

  # ------------------------------------------------------------ 3. Anexos: boletines
  - caption: "Anexos: boletines"
    numbered: false
    chapters:
      - file: notebooks/bols/boletin_inicio_2627.ipynb      # desintegración del protón en SK (antes boletin_desintegracion_proton_simple)
      - file: notebooks/bols/boletin_I_2627.ipynb           # boletín I, cinemática relativista, con soluciones

