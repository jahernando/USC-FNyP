# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Introducción a la Física de Partículas - USC
author: J. Ángel Hernando Morata
logo: logo.jpg
copyright: USC 2026

# Ejecuta los notebooks y cachea el resultado: solo re-ejecuta los que cambian.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: cache
  timeout: 120

# Construye SOLO los ficheros listados en _toc.yml.
# El resto de notebooks (store/, probs/, deteccion, divulgacion, extensiones sin
# revisar...) se quedan en el repo pero no entran en el Book.
only_build_toc_files: true

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book_FNyP.tex

parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    - colon_fence
    # - deflist
    - dollarmath
    # - html_admonition
    - html_image
    - linkify
    # - replacements
    # - smartquotes
    - substitution
    - tasklist
  myst_url_schemes: [mailto, http, https] # URI schemes that will be recognised as external URLs in Markdown links
  myst_dmath_double_inline: true  # Allow display math ($$) within an inline context

# No se usa bibtex: la bibliografía de cada tema está escrita en markdown.
# Si en el futuro se usan citas {cite}, añadir aquí:
#   bibtex_bibfiles:
#     - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/jahernando/USC-FNyP  # Online location of your book
  path_to_book: .  # Path to the book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

sphinx:
  config:
    html_show_copyright: false
    show_authors: false
    language: es

# Botones para abrir cada notebook de forma ejecutable desde la web.
# Binder clona el repositorio entero (funcionan el paquete fnyp/ y las imágenes).
# Colab descarga solo el .ipynb: la celda de configuración clona el repo como
# respaldo, pero las imágenes locales no se ven.
launch_buttons:
  notebook_interface: "classic"
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"